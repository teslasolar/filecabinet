<!DOCTYPE html><html><head><meta charset="UTF-8"><title>🎨 Clustering</title><style>*{margin:0;padding:0}body{overflow:hidden;background:#000a14}#c{position:fixed;top:0;left:0}#h{position:fixed;top:10px;left:10px;color:#00ffff;font:12px monospace;background:rgba(0,0,0,.9);padding:10px;border:1px solid #00ffff}#b{position:fixed;bottom:10px;left:10px;display:flex;gap:5px}.btn{background:rgba(0,255,255,.2);border:1px solid #00ffff;color:#00ffff;padding:8px 12px;cursor:pointer;font:11px monospace}.btn:hover{background:rgba(0,255,255,.4)}</style></head><body><div id="c"></div><div id="h">🎨 CLUSTERING<br>Points: <span id="pts">0</span><br>Clusters: <span id="cls">0</span><br>Iter: <span id="iter">0</span><br>Method: <span id="mth">K-Means</span></div><div id="b"><button class="btn"onclick="K.kmeans()">🎯 K-Means</button><button class="btn"onclick="K.dbscan()">🔍 DBSCAN</button><button class="btn"onclick="K.addPoints()">➕ Points</button><button class="btn"onclick="K.reset()">🔄 Reset</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const K={s:null,c:null,R:null,pts:[],centroids:[],method:'kmeans',k:5,iter:0,eps:15,minPts:3,repo:{files:['train.csv','test.csv','valid.csv','features.npy','labels.npy']},i(){this.s=new THREE.Scene();this.s.background=new THREE.Color(0x000a14);this.s.fog=new THREE.Fog(0x000a14,100,500);this.c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,1e3);this.c.position.set(80,80,80);this.c.lookAt(0,0,0);this.R=new THREE.WebGLRenderer({antialias:1});this.R.setSize(innerWidth,innerHeight);document.getElementById('c').appendChild(this.R.domElement);this.s.add(new THREE.AmbientLight(0x404040));let l=new THREE.PointLight(0x00ffff,1,400);l.position.set(0,100,0);this.s.add(l);this.spawnPoints(100);this.kmeans();this.L();addEventListener('resize',()=>{this.c.aspect=innerWidth/innerHeight;this.c.updateProjectionMatrix();this.R.setSize(innerWidth,innerHeight)})},spawnPoints(n){for(let i=0;i<n;i++){let cluster=Math.floor(Math.random()*5);let cx=[[-30,-30],[30,-30],[-30,30],[30,30],[0,0]][cluster];let x=cx[0]+(Math.random()-.5)*20;let z=cx[1]+(Math.random()-.5)*20;let y=(Math.random()-.5)*40;let g=new THREE.SphereGeometry(1,6,6);let m=new THREE.MeshPhongMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:.5});let p={m:new THREE.Mesh(g,m),x:x,y:y,z:z,cluster:-1,visited:0};p.m.position.set(x,y,z);this.s.add(p.m);this.pts.push(p)}},addPoints(){this.spawnPoints(20)},reset(){this.pts.forEach(p=>{this.s.remove(p.m);p.cluster=-1;p.visited=0});this.pts=[];this.centroids.forEach(c=>this.s.remove(c.m));this.centroids=[];this.iter=0;this.spawnPoints(100)},kmeans(){this.method='kmeans';this.centroids.forEach(c=>this.s.remove(c.m));this.centroids=[];for(let i=0;i<this.k;i++){let p=this.pts[Math.floor(Math.random()*this.pts.length)];let g=new THREE.BoxGeometry(5,5,5);let c=Math.random()*0xffffff;let m=new THREE.MeshPhongMaterial({color:c,emissive:c,emissiveIntensity:.8});let cent={m:new THREE.Mesh(g,m),x:p.x,y:p.y,z:p.z,c:c,pts:[]};cent.m.position.set(p.x,p.y,p.z);this.s.add(cent.m);this.centroids.push(cent)}this.iter=0},kmeansStep(){this.centroids.forEach(c=>c.pts=[]);this.pts.forEach(p=>{let minD=Infinity;let bestC=0;this.centroids.forEach((c,i)=>{let d=Math.hypot(p.x-c.x,p.y-c.y,p.z-c.z);if(d<minD){minD=d;bestC=i}});p.cluster=bestC;p.m.material.color.setHex(this.centroids[bestC].c);p.m.material.emissive.setHex(this.centroids[bestC].c);this.centroids[bestC].pts.push(p)});this.centroids.forEach(c=>{if(c.pts.length===0)return;let avgX=c.pts.reduce((s,p)=>s+p.x,0)/c.pts.length;let avgY=c.pts.reduce((s,p)=>s+p.y,0)/c.pts.length;let avgZ=c.pts.reduce((s,p)=>s+p.z,0)/c.pts.length;c.x+=(avgX-c.x)*.1;c.y+=(avgY-c.y)*.1;c.z+=(avgZ-c.z)*.1;c.m.position.set(c.x,c.y,c.z)});this.iter++},dbscan(){this.method='dbscan';this.centroids.forEach(c=>this.s.remove(c.m));this.centroids=[];this.pts.forEach(p=>{p.cluster=-1;p.visited=0});let clusterId=0;this.pts.forEach(p=>{if(p.visited)return;p.visited=1;let neighbors=this.getNeighbors(p);if(neighbors.length<this.minPts){p.cluster=-1;p.m.material.color.setHex(0x888888);p.m.material.emissive.setHex(0x888888);return}p.cluster=clusterId;let c=Math.random()*0xffffff;p.m.material.color.setHex(c);p.m.material.emissive.setHex(c);let queue=[...neighbors];while(queue.length){let q=queue.shift();if(q.visited)continue;q.visited=1;let qn=this.getNeighbors(q);if(qn.length>=this.minPts){queue.push(...qn)}if(q.cluster===-1){q.cluster=clusterId;q.m.material.color.setHex(c);q.m.material.emissive.setHex(c)}}clusterId++});this.iter++},getNeighbors(p){return this.pts.filter(q=>{let d=Math.hypot(p.x-q.x,p.y-q.y,p.z-q.z);return d<this.eps&&q!==p})},updateViz(){this.centroids.forEach(c=>{c.m.rotation.x+=.02;c.m.rotation.y+=.02;let pulse=Math.sin(Date.now()*.003);c.m.scale.set(1+pulse*.2,1+pulse*.2,1+pulse*.2)});this.pts.forEach(p=>{p.m.rotation.x+=.01;p.m.rotation.y+=.01})},u(){document.getElementById('pts').textContent=this.pts.length;let uniqueClusters=new Set(this.pts.map(p=>p.cluster).filter(c=>c!==-1));document.getElementById('cls').textContent=this.method==='kmeans'?this.k:uniqueClusters.size;document.getElementById('iter').textContent=this.iter;document.getElementById('mth').textContent=this.method.toUpperCase()},L(){requestAnimationFrame(()=>this.L());this.updateViz();if(this.method==='kmeans'&&Math.random()<.1)this.kmeansStep();let t=Date.now()*.0002;this.c.position.x=Math.sin(t)*120;this.c.position.z=Math.cos(t)*120;this.c.lookAt(0,0,0);this.u();this.R.render(this.s,this.c)}};K.i()</script></body></html>
