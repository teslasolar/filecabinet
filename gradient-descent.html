<!DOCTYPE html><html><head><meta charset="UTF-8"><title>📉 Gradient Descent</title><style>*{margin:0;padding:0}body{overflow:hidden;background:#0a0014}#c{position:fixed;top:0;left:0}#h{position:fixed;top:10px;left:10px;color:#f0f;font:12px monospace;background:rgba(0,0,0,.9);padding:10px;border:1px solid #f0f}#b{position:fixed;bottom:10px;left:10px;display:flex;gap:5px}.btn{background:rgba(255,0,255,.2);border:1px solid #f0f;color:#f0f;padding:8px 12px;cursor:pointer;font:11px monospace}.btn:hover{background:rgba(255,0,255,.4)}</style></head><body><div id="c"></div><div id="h">📉 GRADIENT DESCENT<br>Loss: <span id="loss">0</span><br>Step: <span id="step">0</span><br>LR: <span id="lr">0</span><br>Method: <span id="mth">SGD</span></div><div id="b"><button class="btn"onclick="G.SGD()">📊 SGD</button><button class="btn"onclick="G.momentum()">🚀 Momentum</button><button class="btn"onclick="G.adam()">⚡ Adam</button><button class="btn"onclick="G.reset()">🔄 Reset</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const G={s:null,c:null,R:null,surface:null,paths:[],method:'SGD',lr:.5,step:0,momentum:0,velocity:{x:0,y:0},m1:{x:0,y:0},m2:{x:0,y:0},beta1:.9,beta2:.999,i(){this.s=new THREE.Scene();this.s.background=new THREE.Color(0x0a0014);this.s.fog=new THREE.Fog(0x0a0014,100,500);this.c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,1e3);this.c.position.set(80,100,80);this.c.lookAt(0,20,0);this.R=new THREE.WebGLRenderer({antialias:1});this.R.setSize(innerWidth,innerHeight);document.getElementById('c').appendChild(this.R.domElement);this.s.add(new THREE.AmbientLight(0x202020));let l=new THREE.PointLight(0xff00ff,1,400);l.position.set(0,100,0);this.s.add(l);this.buildSurface();this.SGD();this.L();addEventListener('resize',()=>{this.c.aspect=innerWidth/innerHeight;this.c.updateProjectionMatrix();this.R.setSize(innerWidth,innerHeight)})},loss(x,z){let l=0;l+=Math.pow(x*.05,2)+Math.pow(z*.05,2);l+=20*Math.sin(x*.1)*Math.sin(z*.1);l+=10*Math.cos(x*.08+z*.08);return l+50},grad(x,z){let h=.1;let dx=(this.loss(x+h,z)-this.loss(x-h,z))/(2*h);let dz=(this.loss(x,z+h)-this.loss(x,z-h))/(2*h);return{x:dx,z:dz}},buildSurface(){let res=40;let g=new THREE.PlaneGeometry(100,100,res,res);let pos=g.attributes.position;for(let i=0;i<=res;i++){for(let j=0;j<=res;j++){let idx=(i*(res+1)+j)*3;let x=pos.array[idx];let z=pos.array[idx+1];let y=this.loss(x,z);pos.array[idx+2]=y}}g.computeVertexNormals();let colors=new Float32Array((res+1)*(res+1)*3);for(let i=0;i<=res;i++){for(let j=0;j<=res;j++){let idx=(i*(res+1)+j)*3;let y=pos.array[idx+2];let c=new THREE.Color().setHSL((100-y)/100*.3,.9,.5);colors[i*(res+1)*3+j*3]=c.r;colors[i*(res+1)*3+j*3+1]=c.g;colors[i*(res+1)*3+j*3+2]=c.b}}g.setAttribute('color',new THREE.BufferAttribute(colors,3));let m=new THREE.MeshLambertMaterial({vertexColors:1,side:THREE.DoubleSide,wireframe:0});this.surface=new THREE.Mesh(g,m);this.surface.rotation.x=-Math.PI/2;this.s.add(this.surface);let wg=new THREE.EdgesGeometry(g,15);let wm=new THREE.LineBasicMaterial({color:0x444444,transparent:1,opacity:.3});let wire=new THREE.LineSegments(wg,wm);wire.rotation.x=-Math.PI/2;this.s.add(wire)},spawnPath(x,z){let y=this.loss(x,z);let g=new THREE.SphereGeometry(2,8,8);let c=this.method==='SGD'?0xff0000:this.method==='momentum'?0x00ff00:0x00ffff;let m=new THREE.MeshPhongMaterial({color:c,emissive:c,emissiveIntensity:.8});let p={m:new THREE.Mesh(g,m),x:x,z:z,y:y,trail:[]};p.m.position.set(x,y+2,z);this.s.add(p.m);this.paths.push(p);return p},SGD(){this.method='SGD';this.lr=.5;this.reset();this.spawnPath(40,40)},momentum(){this.method='momentum';this.lr=.3;this.momentum=.9;this.velocity={x:0,y:0};this.reset();this.spawnPath(40,40)},adam(){this.method='adam';this.lr=.5;this.m1={x:0,y:0};this.m2={x:0,y:0};this.reset();this.spawnPath(40,40)},reset(){this.paths.forEach(p=>this.s.remove(p.m));this.paths=[];this.step=0;this.velocity={x:0,y:0};this.m1={x:0,y:0};this.m2={x:0,y:0}},updatePaths(){this.paths.forEach(p=>{let g=this.grad(p.x,p.z);if(this.method==='SGD'){p.x-=g.x*this.lr;p.z-=g.z*this.lr}else if(this.method==='momentum'){this.velocity.x=this.momentum*this.velocity.x-this.lr*g.x;this.velocity.z=this.momentum*this.velocity.z-this.lr*g.z;p.x+=this.velocity.x;p.z+=this.velocity.z}else if(this.method==='adam'){this.step++;this.m1.x=this.beta1*this.m1.x+(1-this.beta1)*g.x;this.m1.z=this.beta1*this.m1.z+(1-this.beta1)*g.z;this.m2.x=this.beta2*this.m2.x+(1-this.beta2)*g.x*g.x;this.m2.z=this.beta2*this.m2.z+(1-this.beta2)*g.z*g.z;let m1x=this.m1.x/(1-Math.pow(this.beta1,this.step));let m1z=this.m1.z/(1-Math.pow(this.beta1,this.step));let m2x=this.m2.x/(1-Math.pow(this.beta2,this.step));let m2z=this.m2.z/(1-Math.pow(this.beta2,this.step));p.x-=this.lr*m1x/(Math.sqrt(m2x)+1e-8);p.z-=this.lr*m1z/(Math.sqrt(m2z)+1e-8)}p.x=Math.max(-50,Math.min(50,p.x));p.z=Math.max(-50,Math.min(50,p.z));p.y=this.loss(p.x,p.z);p.m.position.set(p.x,p.y+2,p.z);p.m.rotation.x+=.1;p.m.rotation.y+=.1;if(p.trail.length>100)p.trail.shift();p.trail.push({x:p.x,y:p.y,z:p.z})});this.step++},updateViz(){this.paths.forEach(p=>{let pulse=Math.sin(Date.now()*.005);p.m.scale.set(1+pulse*.3,1+pulse*.3,1+pulse*.3)})},u(){if(this.paths.length){let p=this.paths[0];document.getElementById('loss').textContent=p.y.toFixed(2)}document.getElementById('step').textContent=this.step;document.getElementById('lr').textContent=this.lr.toFixed(3);document.getElementById('mth').textContent=this.method},L(){requestAnimationFrame(()=>this.L());this.updateViz();if(this.paths.length&&Math.random()<.3)this.updatePaths();let t=Date.now()*.0001;this.c.position.x=Math.sin(t)*120;this.c.position.z=Math.cos(t)*120;this.c.lookAt(0,20,0);this.u();this.R.render(this.s,this.c)}};G.i()</script></body></html>
