<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗄️ File Cabinet - Project Index</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #0ff;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid #0ff;
            border-radius: 10px;
            margin-bottom: 40px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        h1 {
            font-size: 48px;
            text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .subtitle {
            color: #0f0;
            font-size: 14px;
            text-shadow: 0 0 10px #0f0;
            position: relative;
            z-index: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(0, 20, 40, 0.8);
            border: 2px solid #0ff;
            border-radius: 10px;
            padding: 25px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.5);
            border-color: #0f0;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .card-icon {
            font-size: 48px;
            filter: drop-shadow(0 0 10px currentColor);
        }

        .card-title {
            font-size: 24px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }

        .card-description {
            color: #aaa;
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .card-features {
            list-style: none;
            padding: 10px 0;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            margin-bottom: 15px;
        }

        .card-features li {
            padding: 5px 0;
            font-size: 11px;
            color: #0f0;
        }

        .card-features li::before {
            content: '▸ ';
            color: #ff0;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: linear-gradient(45deg, #0ff, #0aa);
            border: none;
            color: #000;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: linear-gradient(45deg, #0f0, #0a0);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            transform: scale(1.05);
        }

        .badge {
            background: rgba(255, 255, 0, 0.2);
            color: #ff0;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 10px;
            border: 1px solid #ff0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid #0ff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 10px;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            margin-top: 40px;
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0ff, transparent);
            animation: scan 3s infinite;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.1;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <canvas class="matrix-bg" id="matrix"></canvas>

        <div class="grid" id="projects-grid">
            <!-- Projects will be dynamically added here -->
        </div>

        <footer>
            <p>🔐 Secure Repository System | Last Updated: <span id="timestamp"></span></p>
            <p style="margin-top: 5px;">Auto-discovery enabled | Click any project to launch</p>
        </footer>
    </div>

                features: [

                features: [

                ],

                badge: 'META'

        // Auto-discovery function (scans for HTML files)
        async function discoverProjects() {
            // List of potential HTML files to check
            const potentialFiles = [
                'virtual-repository-3d.html',
                'snt-compiler.html',
                'ai-os-phi.html',
                'demo.html',
                'app.html',
                'visualization.html'
            ];

            // Try to fetch each file to see if it exists
            for (const file of potentialFiles) {
                if (file === 'virtual-repository-3d.html') continue; // Already in database

                try {
                    const response = await fetch(file, { method: 'HEAD' });
                    if (response.ok) {
                        // File exists, add it to projects
                        projects.push({
                            name: file.replace('.html', '').replace(/-/g, ' ').toUpperCase(),
                            file: file,
                            icon: '📄',
                            description: `Interactive HTML project: ${file}`,
                            features: ['Auto-discovered project'],
                            tech: ['HTML', 'JavaScript'],
                            badge: 'FOUND'
                        });
                    }
                } catch (e) {
                    // File doesn't exist or can't be accessed
                }
            }
        }

        // Render projects to grid
        function renderProjects() {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = '';

            projects.forEach((project, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.location.href = project.file;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon">${project.icon}</div>
                        <div class="card-title">${project.name}</div>
                    </div>
                    <div class="card-description">${project.description}</div>
                    <ul class="card-features">
                        ${project.features.map(f => `<li>${f}</li>`).join('')}
                    </ul>
                    <div class="card-footer">
                        <a href="${project.file}" class="btn">LAUNCH →</a>
                        ${project.badge ? `<span class="badge">${project.badge}</span>` : ''}
                    </div>
                `;

                grid.appendChild(card);
            });

            // Update stats
            document.getElementById('project-count').textContent = projects.length;
            document.getElementById('tech-count').textContent =
                new Set(projects.flatMap(p => p.tech || [])).size;
            document.getElementById('feature-count').textContent =
                projects.reduce((sum, p) => sum + p.features.length, 0);
        }

        // Matrix rain effect
        function initMatrix() {
            const canvas = document.getElementById('matrix');
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const chars = '01アイウエオカキクケコサシスセソタチツテト';
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#0ff';
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            setInterval(draw, 33);

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        // Update timestamp
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent =
                now.toISOString().replace('T', ' ').substring(0, 19);
        }

        // Initialize
        async function init() {
            updateTimestamp();
            setInterval(updateTimestamp, 1000);

            await discoverProjects();
            renderProjects();
            initMatrix();

            console.log('%c🗄️ FILE CABINET INITIALIZED', 'color: #0ff; font-size: 20px; font-weight: bold;');
            console.log('%cProjects loaded:', 'color: #0f0', projects.length);
            console.log('%cAuto-discovery enabled', 'color: #ff0');
        }

        // Run on load
        window.addEventListener('load', init);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '9') {
                const index = parseInt(e.key) - 1;
                if (projects[index]) {
                    window.location.href = projects[index].file;
                }
            }
        });
    </script>

</html>
