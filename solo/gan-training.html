nsity:.5});let f={m:new THREE.Mesh(g,m),x:-10,y:30,z:0,quality:quality,real:0,moving:1};f.m.position.set(-10,30,0);this.s.add(f.m);this.fake.push(f)})},trainG(){this.ep++;let avgScore=0;this.fake.forEach(f=>{let score=this.disc.params*(1-f.quality);avgScore+=score});avgScore/=this.fake.length||1;this.gloss=avgScore;this.gen.params=Math.min(1,this.gen.params+.01*(1-avgScore))},trainD(){let realScore=0;this.real.forEach(r=>{realScore+=this.disc.params});realScore/=this.real.length||1;let fakeScore=0;this.fake.forEach(f=>{fakeScore+=this.disc.params*f.quality});fakeScore/=this.fake.length||1;this.dloss=(1-realScore)+fakeScore;this.disc.params=Math.min(1,this.disc.params+.01*(realScore-fakeScore))},toggle(){this.auto=!this.auto},updateSamples(){this.fake.forEach(f=>{if(f.moving){f.x+=(this.disc.x-f.x)*.05;f.y+=(this.disc.y-f.y)*.05;f.m.position.set(f.x,f.y,f.z);if(Math.abs(f.x-this.disc.x)<2)f.moving=0}});this.noise.forEach(n=>{n.m.rotation.x+=.05;n.m.rotation.y+=.05})},updateViz(){this.gen.m.rotation.y+=.01;let gPulse=Math.sin(Date.now()*.002)*2;this.gen.m.position.y=10+gPulse;this.gen.m.material.emissiveIntensity=.3+this.gen.params*.6;this.disc.m.rotation.y-=.01;let dPulse=Math.cos(Date.now()*.002)*2;this.disc.m.position.y=10+dPulse;this.disc.m.material.emissiveIntensity=.3+this.disc.params*.6;this.real.forEach(r=>{r.m.rotation.y+=.02});this.fake.forEach(f=>{f.m.rotation.y+=.02})},u(){document.getElementById('ep').textContent=this.ep;document.getElementById('gloss').textContent=this.gloss.toFixed(3);document.getElementById('dloss').textContent=this.dloss.toFixed(3);let avgQ=this.fake.reduce((s,f)=>s+f.quality,0)/(this.fake.length||1);document.getElementById('qual').textContent=(avgQ*100).toFixed(1)},L(){requestAnimationFrame(()=>this.L());this.updateViz();this.updateSamples();if(this.auto){if(Math.random()<.3)this.generate();if(Math.random()<.2)this.trainD();if(Math.random()<.2)this.trainG()}let t=Date.now()*.0003;this.c.position.x=Math.sin(t)*150;this.c.position.z=Ma
