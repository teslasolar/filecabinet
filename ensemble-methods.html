<!DOCTYPE html><html><head><meta charset="UTF-8"><title>🌳 Ensemble Methods</title><style>*{margin:0;padding:0}body{overflow:hidden;background:#001a00}#c{position:fixed;top:0;left:0}#h{position:fixed;top:10px;left:10px;color:#00ff00;font:12px monospace;background:rgba(0,0,0,.9);padding:10px;border:1px solid #00ff00}#b{position:fixed;bottom:10px;left:10px;display:flex;gap:5px}.btn{background:rgba(0,255,0,.2);border:1px solid #00ff00;color:#00ff00;padding:8px 12px;cursor:pointer;font:11px monospace}.btn:hover{background:rgba(0,255,0,.4)}</style></head><body><div id="c"></div><div id="h">🌳 ENSEMBLE METHODS<br>Trees: <span id="tr">0</span><br>Accuracy: <span id="acc">0</span>%<br>Diversity: <span id="div">0</span>%<br>Method: <span id="mth">Bagging</span></div><div id="b"><button class="btn"onclick="E.addTree()">➕ Tree</button><button class="btn"onclick="E.bagging()">👜 Bagging</button><button class="btn"onclick="E.boosting()">🚀 Boosting</button><button class="btn"onclick="E.vote()">🗳️ Vote</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const E={s:null,c:null,R:null,trees:[],samples:[],method:'bagging',votes:[],repo:{models:['dt','rf','xgb','ada'],data:['train','test','val']},i(){this.s=new THREE.Scene();this.s.background=new THREE.Color(0x001a00);this.s.fog=new THREE.Fog(0x001a00,100,500);this.c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,1e3);this.c.position.set(0,100,150);this.c.lookAt(0,0,0);this.R=new THREE.WebGLRenderer({antialias:1});this.R.setSize(innerWidth,innerHeight);document.getElementById('c').appendChild(this.R.domElement);this.s.add(new THREE.AmbientLight(0x303030));let l=new THREE.PointLight(0x00ff00,1,400);l.position.set(0,100,0);this.s.add(l);this.spawnSamples();for(let i=0;i<7;i++)this.addTree();this.bagging();this.L();addEventListener('resize',()=>{this.c.aspect=innerWidth/innerHeight;this.c.updateProjectionMatrix();this.R.setSize(innerWidth,innerHeight)})},spawnSamples(){for(let i=0;i<20;i++){let g=new THREE.SphereGeometry(1.5,6,6);let label=Math.random()>.5?1:0;let c=label?0xff0000:0x0000ff;let m=new THREE.MeshPhongMaterial({color:c,emissive:c,emissiveIntensity:.5});let x=(Math.random()-.5)*80;let z=(Math.random()-.5)*80;let s={m:new THREE.Mesh(g,m),x:x,y:-30,z:z,label:label};s.m.position.set(x,-30,z);this.s.add(s.m);this.samples.push(s)}},addTree(){if(this.trees.length>=15)return;let x=(this.trees.length%5-2)*25;let z=Math.floor(this.trees.length/5)*25-25;let tree={root:null,x:x,z:z,acc:Math.random()*.4+.5,weight:1,nodes:[],prediction:null};this.buildTree(tree);this.trees.push(tree)},buildTree(tree){let g=new THREE.CylinderGeometry(2,2,4,6);let m=new THREE.MeshPhongMaterial({color:0x00ff00,emissive:0x00ff00,emissiveIntensity:.5});tree.root={m:new THREE.Mesh(g,m),x:tree.x,y:0,z:tree.z,level:0};tree.root.m.position.set(tree.x,0,tree.z);this.s.add(tree.root.m);tree.nodes.push(tree.root);for(let i=0;i<3;i++){this.growLevel(tree,i)}},growLevel(tree,level){let parents=tree.nodes.filter(n=>n.level===level);parents.forEach((p,pi)=>{let numChildren=Math.random()>.5?2:0;for(let i=0;i<numChildren;i++){let g=new THREE.CylinderGeometry(1.5,1.5,3,6);let m=new THREE.MeshPhongMaterial({color:0x88ff00,emissive:0x88ff00,emissiveIntensity:.4});let offset=(i-.5)*8;let child={m:new THREE.Mesh(g,m),x:p.x+offset,y:p.y-(level+1)*8,z:p.z+Math.random()*4-2,level:level+1,parent:p};child.m.position.set(child.x,child.y,child.z);this.s.add(child.m);tree.nodes.push(child);let pts=[new THREE.Vector3(p.x,p.y-2,p.z),new THREE.Vector3(child.x,child.y+1.5,child.z)];let lg=new THREE.BufferGeometry().setFromPoints(pts);let lm=new THREE.LineBasicMaterial({color:0x00ff00,transparent:1,opacity:.5});let line=new THREE.Line(lg,lm);this.s.add(line)}})},bagging(){this.method='bagging';this.trees.forEach(t=>t.weight=1)},boosting(){this.method='boosting';this.trees.forEach((t,i)=>{t.weight=.5+t.acc*.5})},vote(){this.votes=[];this.samples.forEach(s=>{let votes={0:0,1:0};this.trees.
