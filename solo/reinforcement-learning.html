<!DOCTYPE html><html><head><meta charset="UTF-8"><title>🎮 Reinforcement Learning</title><style>*{margin:0;padding:0}body{overflow:hidden;background:#140a00}#c{position:fixed;top:0;left:0}#h{position:fixed;top:10px;left:10px;color:#ff8800;font:12px monospace;background:rgba(0,0,0,.9);padding:10px;border:1px solid #ff8800}#b{position:fixed;bottom:10px;left:10px;display:flex;gap:5px}.btn{background:rgba(255,136,0,.2);border:1px solid #ff8800;color:#ff8800;padding:8px 12px;cursor:pointer;font:11px monospace}.btn:hover{background:rgba(255,136,0,.4)}</style></head><body><div id="c"></div><div id="h">🎮 REINFORCEMENT LEARNING<br>Episode: <span id="ep">0</span><br>Reward: <span id="rw">0</span><br>Epsilon: <span id="eps">1.0</span><br>Q-Max: <span id="qmax">0</span></div><div id="b"><button class="btn"onclick="R.reset()">🔄 Reset</button><button class="btn"onclick="R.explore()">🔍 Explore</button><button class="btn"onclick="R.exploit()">🎯 Exploit</button><button class="btn"onclick="R.train()">🎓 Train</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const R={s:null,c:null,R:null,agent:null,goals:[],obstacles:[],Q:{},eps:.9,gamma:.95,alpha:.1,ep:0,totalR:0,gridSize:10,i(){this.s=new THREE.Scene();this.s.background=new THREE.Color(0x140a00);this.s.fog=new THREE.Fog(0x140a00,100,400);this.c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,1e3);this.c.position.set(60,80,60);this.c.lookAt(0,0,0);this.R=new THREE.WebGLRenderer({antialias:1});this.R.setSize(innerWidth,innerHeight);document.getElementById('c').appendChild(this.R.domElement);this.s.add(new THREE.AmbientLight(0x404040));let l=new THREE.PointLight(0xff8800,1,300);l.position.set(0,50,0);this.s.add(l);this.buildEnv();this.L();addEventListener('resize',()=>{this.c.aspect=innerWidth/innerHeight;this.c.updateProjectionMatrix();this.R.setSize(innerWidth,innerHeight)})},buildEnv(){let p=new THREE.PlaneGeometry(100,100,this.gridSize,this.gridSize);let m=new THREE.MeshLambertMaterial({color:0x222222,wireframe:1});let ground=new THREE.Mesh(p,m);ground.rotation.x=-Math.PI/2;this.s.add(ground);for(let i=0;i<=this.gridSize;i++){for(let j=0;j<=this.gridSize;j++){let x=(i-this.gridSize/2)*10;let z=(j-this.gridSize/2)*10;let g=new THREE.BoxGeometry(8,1,8);let mat=new THREE.MeshLambertMaterial({color:0x333333,transparent:1,opacity:.3});let tile=new THREE.Mesh(g,mat);tile.position.set(x,.5,z);this.s.add(tile)}}this.spawnAgent();for(let i=0;i<5;i++)this.spawnGoal();for(let i=0;i<8;i++)this.spawnObstacle()},spawnAgent(){let g=new THREE.ConeGeometry(3,6,4);let m=new THREE.MeshPhongMaterial({color:0x00ff00,emissive:0x00ff00,emissiveIntensity:.6});this.agent={m:new THREE.Mesh(g,m),x:0,z:0,gx:0,gz:0,action:null,reward:0,done:0,path:[]};this.agent.m.position.set(0,3,0);this.s.add(this.agent.m)},spawnGoal(){let x=(Math.random()-.5)*80;let z=(Math.random()-.5)*80;let v=10+Math.random()*20;let g=new THREE.SphereGeometry(3,8,8);let m=new THREE.MeshPhongMaterial({color:0xffff00,emissive:0xffff00,emissiveIntensity:.8});let goal={m:new THREE.Mesh(g,m),x:x,z:z,v:v,collected:0};goal.m.position.set(x,3,z);this.s.add(goal.m);this.goals.push(goal);return goal},spawnObstacle(){let x=(Math.random()-.5)*70;let z=(Math.random()-.5)*70;let g=new THREE.BoxGeometry(8,10,8);let m=new THREE.MeshLambertMaterial({color:0xff0000,transparent:1,opacity:.6});let obs={m:new THREE.Mesh(g,m),x:x,z:z};obs.m.position.set(x,5,z);this.s.add(obs.m);this.obstacles.push(obs);return obs},getState(){return`${Math.round(this.agent.x/10)},${Math.round(this.agent.z/10)}`},getActions(){return[[10,0],[-10,0],[0,10],[0,-10],[7,7],[-7,7],[7,-7],[-7,-7]]},getQ(s,a){let k=`${s}:${a[0]},${a[1]}`;return this.Q[k]||0},setQ(s,a,v){let k=`${s}:${a[0]},${a[1]}`;this.Q[k]=v},chooseAction(s){if(Math.random()<this.eps){return this.getActions()[Math.floor(Math.random()*8)]}let acts=this.getActions();let best=acts[0];let maxQ=-Infinity;acts.forEach(a=>{let q=this.getQ(s,a);if(q>maxQ){maxQ=q;best=a}});return best},step(a){let nx=this.agent.x+a[0];let nz=this.agent.z+a[1];nx=Math.max(-50,Math.min(50,nx));nz=Math.max(-50,Math.min(50,nz));let r=-1;let done=0;this.obstacles.forEach(o=>{let d=Math.hypot(nx-o.x,nz-o.z);if(d<10){r-=20;done=1}});this.goals.forEach(g=>{if(g.collected)return;let d=Math.hypot(nx-g.x,nz-g.z);if(d<8){r+=g.v;g.collected=1;this.s.remove(g.m)}});this.agent.x=nx;this.agent.z=nz;this.agent.reward=r;this.totalR+=r;return{s:this.getState(),r:r,done:done}},reset(){this.ep++;this.totalR=0;this.agent.x=0;this.agent.z=0;this.agent.done=0;this.eps=Math.max(.1,this.eps*.995);this.goals.forEach(g=>{if(g.collected){g.collected=0;this.s.add(g.m)}})},explore(){this.eps=Math.min(1,this.eps+.1)},exploit(){this.eps=Math.max(0,this.eps-.1)},train(){let s=this.getState();let a=this.chooseAction(s);let res=this.step(a);let ns=res.s;let r=res.r;let maxQ=-Infinity;this.getActions().forEach(na=>{let q=this.getQ(ns,na);if(q>maxQ)maxQ=q});let oldQ=this.getQ(s,a);let newQ=oldQ+this.alpha*(r+this.gamma*maxQ-oldQ);this.setQ(s,a,newQ);if(res.done||this.totalR>100)this.reset()},updateViz(){this.agent.m.position.set(this.agent.x,3,this.agent.z);this.agent.m.rotation.y+=.05;let rScale=1+Math.max(-1,Math.min(1,this.agent.reward/10))*.5;this.agent.m.scale.set(rScale,rScale,rScale);if(this.agent.reward>0){this.agent.m.material.color.setHex(0x00ff00)}else if(this.agent.reward<0){this.agent.m.material.color.setHex(0xff0000)}else{this.agent.m.material.color.setHex(0x00ff00)}this.goals.forEach(g=>{if(!g.collected){g.m.rotation.y+=.02;let pulse=Math.sin(Date.now()*.003)*2;g.m.position.y=3+pulse}})},u(){document.getElementById('ep').textContent=this.ep;document.getElementById('rw').textContent=this.totalR.toFixed(1);document.getElementById('eps').textContent=this.eps.toFixed(2);let maxQ=-Infinity;Object.values(this.Q).forEach(v=>{if(v>maxQ)maxQ=v});document.getElementById('qmax').textContent=maxQ.toFixed(1)},L(){requestAnimationFrame(()=>this.L());this.updateViz();if(Math.random()<
