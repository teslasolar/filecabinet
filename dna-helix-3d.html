<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 DNA Helix File System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0ff;
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 100, 100, 0.2);
            border: 1px solid #0ff;
            padding: 15px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        .stat { display: flex; justify-content: space-between; padding: 5px 0; }
        .stat-label { color: #888; }
        .stat-value { color: #0ff; font-weight: bold; }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }
        .btn {
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid #0ff;
            color: #0ff;
            padding: 10px 15px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            font-size: 11px;
        }
        .btn:hover {
            background: rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 20px #0ff;
        }
        #info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #f0f;
            padding: 15px;
            max-width: 250px;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <div id="hud">
        <div style="color: #0ff; font-weight: bold; margin-bottom: 10px; font-size: 16px;">
            🧬 DNA HELIX
        </div>
        <div class="stat">
            <span class="stat-label">Base Pairs:</span>
            <span class="stat-value" id="stat-pairs">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Strands:</span>
            <span class="stat-value" id="stat-strands">2</span>
        </div>
        <div class="stat">
            <span class="stat-label">Mutations:</span>
            <span class="stat-value" id="stat-mutations">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Rotation:</span>
            <span class="stat-value" id="stat-rotation">0°</span>
        </div>
    </div>

    <div id="info">
        <div style="color: #f0f; font-size: 12px; margin-bottom: 5px;">FILE HIERARCHY AS DNA</div>
        <div style="font-size: 10px; color: #aaa; line-height: 1.6;">
            Each base pair represents a file or directory. Connections show dependencies. The double helix structure encodes your project's genetic information.
        </div>
    </div>

    <div id="controls">
        <button class="btn" onclick="DNA.addBasePair()">➕ Add Base Pair</button>
        <button class="btn" onclick="DNA.mutate()">🧬 Mutate</button>
        <button class="btn" onclick="DNA.speedUp()">⏩ Speed Up</button>
        <button class="btn" onclick="DNA.slowDown()">⏪ Slow Down</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const DNA = {
            scene: null,
            camera: null,
            renderer: null,
            basePairs: [],
            connections: [],
            rotationSpeed: 0.005,
            mutations: 0,

            // DNA base colors
            baseColors: {
                'A': 0x00ff00, // Adenine - green
                'T': 0xff0000, // Thymine - red
                'G': 0x00ffff, // Guanine - cyan
                'C': 0xffff00  // Cytosine - yellow
            },

            fileMapping: {
                'ts': 'A', 'js': 'A',
                'json': 'T', 'yaml': 'T',
                'css': 'G', 'scss': 'G',
                'html': 'C', 'tsx': 'C'
            },

            init() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x000510);
                this.scene.fog = new THREE.Fog(0x000510, 400, 1000);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 2000);
                this.camera.position.set(0, 0, 500);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                document.getElementById('container').appendChild(this.renderer.domElement);

                // Lights
                const ambientLight = new THREE.AmbientLight(0x404040);
                this.scene.add(ambientLight);

                const pointLight1 = new THREE.PointLight(0x00ffff, 1, 300);
                pointLight1.position.set(100, 0, 0);
                this.scene.add(pointLight1);

                const pointLight2 = new THREE.PointLight(0xff00ff, 1, 300);
                pointLight2.position.set(-100, 0, 0);
                this.scene.add(pointLight2);

                // Create initial helix
                this.createHelix();

                this.setupControls();
                this.animate();
            },

            createHelix() {
                const files = [
                    'index.ts', 'app.ts', 'config.json', 'styles.css',
                    'utils.ts', 'api.ts', 'routes.tsx', 'models.ts',
                    'services.ts', 'database.json', 'theme.scss', 'layout.html',
                    'auth.ts', 'middleware.ts', 'constants.json', 'components.tsx'
                ];

                files.forEach((file, i) => {
                    this.createBasePair(file, i);
                });
            },

            createBasePair(fileName, index) {
                const ext = fileName.split('.').pop();
                const baseType = this.fileMapping[ext] || 'A';
                const complementType = this.getComplement(baseType);

                const radius = 80;
                const height = index * 30 - 200;
                const angle = index * 0.5; // Twist angle

                // Left strand base
                const leftBase = this.createBase(baseType, radius, height, angle);
                leftBase.userData.fileName = fileName;
                leftBase.userData.baseType = baseType;
                leftBase.userData.strand = 'left';

                // Right strand base (complement)
                const rightBase = this.createBase(complementType, -radius, height, angle);
                rightBase.userData.fileName = fileName + '.complement';
                rightBase.userData.baseType = complementType;
                rightBase.userData.strand = 'right';

                // Connection between bases
                const connection = this.createConnection(leftBase, rightBase);

                const pair = {
                    left: leftBase,
                    right: rightBase,
                    connection: connection,
                    index: index,
                    height: height,
                    angle: angle
                };

                this.basePairs.push(pair);
                return pair;
            },

            createBase(baseType, radius, height, angle) {
                const geometry = new THREE.SphereGeometry(8, 16, 16);
                const material = new THREE.MeshPhongMaterial({
                    color: this.baseColors[baseType],
                    emissive: this.baseColors[baseType],
                    emissiveIntensity: 0.3,
                    shininess: 30
                });
                const base = new THREE.Mesh(geometry, material);

                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                base.position.set(x, height, z);

                // Add glow
                const glowGeometry = new THREE.SphereGeometry(12, 16, 16);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: this.baseColors[baseType],
                    transparent: true,
                    opacity: 0.2
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                base.add(glow);

                this.scene.add(base);
                return base;
            },

            createConnection(leftBase, rightBase) {
                const material = new THREE.LineBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.3
                });

                const geometry = new THREE.BufferGeometry().setFromPoints([
                    leftBase.position.clone(),
                    rightBase.position.clone()
                ]);

                const line = new THREE.Line(geometry, material);
                this.scene.add(line);

                return line;
            },

            getComplement(base) {
                const complements = { 'A': 'T', 'T': 'A', 'G': 'C', 'C': 'G' };
                return complements[base];
            },

            updateHelix() {
                const time = Date.now() * this.rotationSpeed;

                this.basePairs.forEach((pair, index) => {
                    const angle = pair.angle + time;
                    const radius = 80;

                    // Update left strand
                    const leftX = Math.cos(angle) * radius;
                    const leftZ = Math.sin(angle) * radius;
                    pair.left.position.x = leftX;
                    pair.left.position.z = leftZ;

                    // Update right strand (opposite side)
                    const rightX = Math.cos(angle + Math.PI) * radius;
                    const rightZ = Math.sin(angle + Math.PI) * radius;
                    pair.right.position.x = rightX;
                    pair.right.position.z = rightZ;

                    // Update connection
                    const points = [
                        pair.left.position.clone(),
                        pair.right.position.clone()
                    ];
                    pair.connection.geometry.setFromPoints(points);

                    // Pulse effect
                    const pulse = Math.sin(time * 2 + index * 0.5) * 0.3 + 1;
                    pair.left.scale.set(pulse, pulse, pulse);
                    pair.right.scale.set(pulse, pulse, pulse);
                });

                // Draw backbone strands
                this.updateBackbone();
            },

            updateBackbone() {
                // Remove old backbone
                this.scene.children = this.scene.children.filter(child =>
                    !child.userData.backbone
                );

                // Left strand backbone
                const leftPoints = this.basePairs.map(pair => pair.left.position.clone());
                this.drawBackbone(leftPoints, 0x00ffff);

                // Right strand backbone
                const rightPoints = this.basePairs.map(pair => pair.right.position.clone());
                this.drawBackbone(rightPoints, 0xff00ff);
            },

            drawBackbone(points, color) {
                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeometry = new THREE.TubeGeometry(curve, 64, 2, 8, false);
                const tubeMaterial = new THREE.MeshPhongMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.2,
                    transparent: true,
                    opacity: 0.6
                });
                const tube = new THREE.Mesh(tubeGeometry, tubeMaterial);
                tube.userData.backbone = true;
                this.scene.add(tube);
            },

            addBasePair() {
                const fileExts = Object.keys(this.fileMapping);
                const ext = fileExts[Math.floor(Math.random() * fileExts.length)];
                const fileName = `file_${this.basePairs.length}.${ext}`;

                this.createBasePair(fileName, this.basePairs.length);
            },

            mutate() {
                // Random mutation - change a base
                if (this.basePairs.length === 0) return;

                const pair = this.basePairs[Math.floor(Math.random() * this.basePairs.length)];
                const bases = Object.keys(this.baseColors);
                const newBase = bases[Math.floor(Math.random() * bases.length)];

                pair.left.material.color.setHex(this.baseColors[newBase]);
                pair.left.material.emissive.setHex(this.baseColors[newBase]);
                pair.left.userData.baseType = newBase;

                const complement = this.getComplement(newBase);
                pair.right.material.color.setHex(this.baseColors[complement]);
                pair.right.material.emissive.setHex(this.baseColors[complement]);
                pair.right.userData.baseType = complement;

                this.mutations++;

                // Flash effect
                pair.left.material.emissiveIntensity = 1.5;
                pair.right.material.emissiveIntensity = 1.5;
                setTimeout(() => {
                    pair.left.material.emissiveIntensity = 0.3;
                    pair.right.material.emissiveIntensity = 0.3;
                }, 500);
            },

            speedUp() {
                this.rotationSpeed = Math.min(0.02, this.rotationSpeed * 1.5);
            },

            slowDown() {
                this.rotationSpeed = Math.max(0.001, this.rotationSpeed / 1.5);
            },

            updateStats() {
                document.getElementById('stat-pairs').textContent = this.basePairs.length;
                document.getElementById('stat-mutations').textContent = this.mutations;
                const rotation = ((Date.now() * this.rotationSpeed) % (Math.PI * 2)) * (180 / Math.PI);
                document.getElementById('stat-rotation').textContent = rotation.toFixed(0) + '°';
            },

            setupControls() {
                let isDragging = false;
                let previousMouse = { x: 0, y: 0 };

                this.renderer.domElement.addEventListener('mousedown', () => {
                    isDragging = true;
                });

                this.renderer.domElement.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const deltaX = e.clientX - previousMouse.x;
                        const deltaY = e.clientY - previousMouse.y;

                        this.camera.position.x -= deltaX * 0.5;
                        this.camera.position.y += deltaY * 0.5;
                        this.camera.lookAt(0, 0, 0);
                    }
                    previousMouse = { x: e.clientX, y: e.clientY };
                });

                this.renderer.domElement.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                this.renderer.domElement.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    this.camera.position.z += e.deltaY * 0.5;
                    this.camera.position.z = Math.max(200, Math.min(1000, this.camera.position.z));
                });

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            },

            animate() {
                requestAnimationFrame(() => this.animate());

                this.updateHelix();
                this.updateStats();

                // Slowly orbit camera
                const time = Date.now() * 0.0001;
                this.camera.position.x = Math.sin(time) * 500;
                this.camera.position.z = Math.cos(time) * 500;
                this.camera.lookAt(0, 0, 0);

                this.renderer.render(this.scene, this.camera);
            }
        };

        window.addEventListener('load', () => DNA.init());
    </script>
</body>
</html>
