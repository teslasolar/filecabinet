<!DOCTYPE html><html><head><meta charset="UTF-8"><title>👁️ Attention Mechanism</title><style>*{margin:0;padding:0}body{overflow:hidden;background:#001a0a}#c{position:fixed;top:0;left:0}#h{position:fixed;top:10px;left:10px;color:#0f0;font:12px monospace;background:rgba(0,0,0,.9);padding:10px;border:1px solid #0f0}#b{position:fixed;bottom:10px;left:10px;display:flex;gap:5px}.btn{background:rgba(0,255,0,.2);border:1px solid #0f0;color:#0f0;padding:8px 12px;cursor:pointer;font:11px monospace}.btn:hover{background:rgba(0,255,0,.4)}</style></head><body><div id="c"></div><div id="h">👁️ ATTENTION MECHANISM<br>Tokens: <span id="tk">0</span><br>Heads: <span id="hd">0</span><br>Attention: <span id="att">0</span>%<br>Type: <span id="tp">self</span></div><div id="b"><button class="btn"onclick="A.selfAttn()">🔄 Self</button><button class="btn"onclick="A.crossAttn()">✖️ Cross</button><button class="btn"onclick="A.addHead()">➕ Head</button><button class="btn"onclick="A.multiHead()">🌐 Multi</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const A={s:null,c:null,R:null,Q:[],K:[],V:[],H:[],attn:[],type:'self',seqLen:8,heads:4,repo:{files:['model.py','train.py','data.py','config.py','test.py','utils.py','loss.py','optim.py']},i(){this.s=new THREE.Scene();this.s.background=new THREE.Color(0x001a0a);this.s.fog=new THREE.Fog(0x001a0a,100,400);this.c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,1e3);this.c.position.set(0,60,100);this.c.lookAt(0,0,0);this.R=new THREE.WebGLRenderer({antialias:1});this.R.setSize(innerWidth,innerHeight);document.getElementById('c').appendChild(this.R.domElement);this.s.add(new THREE.AmbientLight(0x404040));let l=new THREE.PointLight(0x00ff00,1,300);l.position.set(0,50,0);this.s.add(l);this.buildSeq();this.selfAttn();this.L();addEventListener('resize',()=>{this.c.aspect=innerWidth/innerHeight;this.c.updateProjectionMatrix();this.R.setSize(innerWidth,innerHeight)})},buildSeq(){for(let i=0;i<this.seqLen;i++){let x=(i-this.seqLen/2)*12;this.Q.push(this.makeTok(x,-20,0,0x00ff00,'Q'));this.K.push(this.makeTok(x,0,0,0x00ffff,'K'));this.V.push(this.makeTok(x,20,0,0xff00ff,'V'))}},makeTok(x,y,z,c,label){let g=new THREE.BoxGeometry(4,4,4);let m=new THREE.MeshPhongMaterial({color:c,emissive:c,emissiveIntensity:.5,transparent:1,opacity:.8});let tok={m:new THREE.Mesh(g,m),x,y,z,val:Math.random(),c:c,attn:0};tok.m.position.set(x,y,z);this.s.add(tok.m);let lbl=this.makeLabel(label,c);lbl.position.y=5;tok.m.add(lbl);return tok},makeLabel(t,c){let canvas=document.createElement('canvas');canvas.width=64;canvas.height=32;let ctx=canvas.getContext('2d');ctx.fillStyle='#'+c.toString(16).padStart(6,'0');ctx.font='bold 20px monospace';ctx.fillText(t,10,22);let tex=new THREE.CanvasTexture(canvas);let mat=new THREE.SpriteMaterial({map:tex,transparent:1});let sprite=new THREE.Sprite(mat);sprite.scale.set(8,4,1);return sprite},selfAttn(){this.type='self';this.clearAttn();for(let i=0;i<this.Q.length;i++){for(let j=0;j<this.K.length;j++){let score=Math.abs(this.Q[i].val-this.K[j].val);let weight=Math.exp(-score*2);this.createAttnLine(this.Q[i],this.K[j],weight);if(weight>.3){this.createAttnLine(this.K[j],this.V[j],weight*.7)}}}},crossAttn(){this.type='cross';this.clearAttn();for(let i=0;i<this.Q.length;i++){let idx=(i+Math.floor(this.Q.length/2))%this.K.length;let weight=.5+Math.random()*.5;this.createAttnLine(this.Q[i],this.K[idx],weight);this.createAttnLine(this.K[idx],this.V[idx],weight*.8)}},createAttnLine(from,to,w){let curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(from.x,from.y,from.z),new THREE.Vector3((from.x+to.x)/2,(from.y+to.y)/2+10,(from.z+to.z)/2),new THREE.Vector3(to.x,to.y,to.z));let pts=curve.getPoints(20);let g=new THREE.BufferGeometry().setFromPoints(pts);let c=new THREE.Color().setHSL(.3*w,.9,.5);let mat=new THREE.LineBasicMaterial({color:c,transparent:1,opacity:w*.8});let line=new THREE.Line(g,mat);this.s.add(line);this.attn.push({l:line,w:w,age:0});from.attn+=w;to.attn+=w},clearAttn(){this.attn.forEach(a=>this.s.remove(a.l));this.attn=[];this.Q.forEach(q=>q.attn=0);this.K.forEach(k=>k.attn=0);this.V.forEach(v=>v.attn=0)},addHead(){if(this.heads>=8)return;this.heads++;let y=-40-this.heads*15;for(let i=0;i<this.seqLen;i++){let x=(i-this.seqLen/2)*12;let c=Math.random()*0xffffff;this.H.push(this.makeTok(x,y,0,c,'H'+this.heads))}},multiHead(){this.clearAttn();for(let h=0;h<Math.min(this.heads,4);h++){for(let i=0;i<this.Q.length;i++){let j=(i+h)%this.K.length;let w=.3+Math.random()*.5;this.createAttnLine(this.Q[i],this.K[j],w/(1+h*.2))}}},updateViz(){this.Q.forEach((q,i)=>{let scale=.8+q.attn*.4;q.m.scale.set(scale,scale,scale);q.m.rotation.y+=.02;q.m.material.emissiveIntensity=.3+q.attn*.5});this.K.forEach((k,i)=>{let scale=.8+k.attn*.4;k.m.scale.set(scale,scale,scale);k.m.rotation.y+=.02;k.m.material.emissiveIntensity=.3+k.attn*.5});this.V.forEach((v,i)=>{let scale=.8+v.attn*.4;v.m.scale.set(scale,scale,scale);v.m.rotation.y+=.02;v.m.material.emissiveIntensity=.3+v.attn*.5});this.attn.forEach(a=>{a.age+=.01;let pulse=Math.sin(Date.now()*.003+a.age*10);a.l.material.opacity=a.w*.5+pulse*.2})},u(){document.getElementById('tk').textContent=this.Q.length;document.getElementById('hd').textContent=this.heads;let avgAttn=this.attn.reduce((s,a)=>s+a.w,0)/(this.attn.length||1);document.getElementById('att').textContent=(avgAttn*100).toFixed(1);document.getElementById('tp').textContent=this.type},L(){requestAnimationFrame(()=>this.L());this.updateViz();if(Math.random()<.01){this.type==='self'?this.selfAttn():this.crossAttn()}let t=Date.now()*.0003;this.c.position.x=Math.sin(t)*100;this.c.position.z=Math.cos(t)*100;this.c.lookAt(0,0,0);this.u();this.R.render(this.s,this.c)}};A.i()</script></body></html>
