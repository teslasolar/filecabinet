<!DOCTYPE html><html><head><meta charset="UTF-8"><title>🎯 Hyperparameter Search</title><style>*{margin:0;padding:0}body{overflow:hidden;background:#140014}#c{position:fixed;top:0;left:0}#h{position:fixed;top:10px;left:10px;color:#ff00ff;font:12px monospace;background:rgba(0,0,0,.9);padding:10px;border:1px solid #ff00ff}#b{position:fixed;bottom:10px;left:10px;display:flex;gap:5px}.btn{background:rgba(255,0,255,.2);border:1px solid #ff00ff;color:#ff00ff;padding:8px 12px;cursor:pointer;font:11px monospace}.btn:hover{background:rgba(255,0,255,.4)}</style></head><body><div id="c"></div><div id="h">🎯 HYPERPARAMETER SEARCH<br>Tests: <span id="t">0</span><br>Best: <span id="best">0</span>%<br>Method: <span id="mth">grid</span><br>Params: <span id="prm">-</span></div><div id="b"><button class="btn"onclick="H.grid()">📊 Grid</button><button class="btn"onclick="H.random()">🎲 Random</button><button class="btn"onclick="H.bayes()">🧠 Bayesian</button><button class="btn"onclick="H.gradient()">📈 Gradient</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const H={s:null,c:null,R:null,P:[],T:[],best:{lr:0,bs:0,dr:0,score:0},tc:0,method:'grid',repo:{models:['cnn','rnn','lstm','transformer'],ranges:{lr:[.0001,.001,.01,.1],bs:[16,32,64,128],dr:[0,.2,.4,.6]}},i(){this.s=new THREE.Scene();this.s.background=new THREE.Color(0x140014);this.s.fog=new THREE.Fog(0x140014,100,500);this.c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,1e3);this.c.position.set(80,80,120);this.c.lookAt(0,0,0);this.R=new THREE.WebGLRenderer({antialias:1});this.R.setSize(innerWidth,innerHeight);document.getElementById('c').appendChild(this.R.domElement);this.s.add(new THREE.AmbientLight(0x202020));let l=new THREE.PointLight(0xff00ff,1,400);l.position.set(0,100,0);this.s.add(l);this.buildSpace();this.grid();this.L();addEventListener('resize',()=>{this.c.aspect=innerWidth/innerHeight;this.c.updateProjectionMatrix();this.R.setSize(innerWidth,innerHeight)})},buildSpace(){let g=new THREE.BoxGeometry(100,100,100);let e=new THREE.EdgesGeometry(g);let m=new THREE.LineBasicMaterial({color:0x444444,transparent:1,opacity:.3});let frame=new THREE.LineSegments(e,m);this.s.add(frame);for(let i=0;i<=10;i++){let x=(i-5)*10;for(let j=0;j<=10;j++){let y=(j-5)*10;for(let k=0;k<=10;k++){let z=(k-5)*10;if(i%2===0&&j%2===0&&k%2===0){let pg=new THREE.SphereGeometry(.3,4,4);let pm=new THREE.MeshBasicMaterial({color:0x222222,transparent:1,opacity:.2});let p=new THREE.Mesh(pg,pm);p.position.set(x,y,z);this.s.add(p)}}}}let labels=[{t:'LR',x:-60,y:0,z:0},{t:'BS',x:0,y:-60,z:0},{t:'DR',x:0,y:0,z:-60}];labels.forEach(lb=>{let canvas=document.createElement('canvas');canvas.width=64;canvas.height=32;let ctx=canvas.getContext('2d');ctx.fillStyle='#ff00ff';ctx.font='bold 20px monospace';ctx.fillText(lb.t,5,22);let tex=new THREE.CanvasTexture(canvas);let mat=new THREE.SpriteMaterial({map:tex,transparent:1});let sprite=new THREE.Sprite(mat);sprite.scale.set(15,7.5,1);sprite.position.set(lb.x,lb.y,lb.z);this.s.add(sprite)})},evalParams(lr,bs,dr){let score=0;score+=lr>.001&&lr<.05?30:10;score+=bs===32||bs===64?25:15;score+=(1-dr)*20;score+=Math.sin(lr*1000)*10;score+=Math.cos(bs)*10;score+=Math.random()*30;return Math.min(100,score)},normalize(v,min,max){return(v-min)/(max-min)*100-50},denorm(v,min,max){return(v+50)/100*(max-min)+min},getColor(score){let h=(score/100)*.33;return new THREE.Color().setHSL(h,.9,.5)},addTest(lr,bs,dr,method){let score=this.evalParams(lr,bs,dr);this.tc++;if(score>this.best.score){this.best={lr,bs,dr,score}}let x=this.normalize(Math.log10(lr),-4,-1);let y=this.normalize(bs,16,128);let z=this.normalize(dr,0,.6);let size=2+score*.08;let g=new THREE.SphereGeometry(size,8,8);let c=this.getColor(score);let m=new THREE.MeshPhongMaterial({color:c,emissive:c,emissiveIntensity:.6,transparent:1,opacity:.8});let test={m:new THREE.Mesh(g,m),lr,bs,dr,score,x,y,z,age:0,method};test.m.position.set(x,y,z);this.s.add(test.m);this.T.push(test);if(this.T.length>200){let old=this.T.shift();this.s.remove(old.m)}return score},grid(){this.method='grid';let lr=this.repo.ranges.lr[Math.floor(Math.random()*4)];let bs=this.repo.ranges.bs[Math.floor(Math.random()*4)];let dr=this.repo.ranges.dr[Math.floor(Math.random()*4)];this.addTest(lr,bs,dr,'grid')},random(){this.method='random';let lr=Math.pow(10,Math.random()*3-4);let bs=Math.pow(2,Math.floor(Math.random()*4)+4);let dr=Math.random()*.6;this.addTest(lr,bs,dr,'random')},bayes(){this.method='bayesian';if(this.T.length<5){this.random();return}let top=this.T.filter(t=>t.score>70).sort((a,b)=>b.score-a.score).slice(0,5);if(top.length===0)top=this.T.slice(-5);let best=top[0];let lr=best.lr*(.5+Math.random());let bs=Math.pow(2,Math.round(Math.log2(best.bs))+Math.floor(Math.random()*3-1));let dr=best.dr+Math.random()*.2-.1;lr=Math.max(.0001,Math.min(.1,lr));bs=Math.max(16,Math.min(128,bs));dr=Math.max(0,Math.min(.6,dr));this.addTest(lr,bs,dr,'bayes')},gradient(){this.method='gradient';if(this.T.length<3){this.random();return}let recent=this.T.slice(-3);let best=recent.reduce((a,b)=>a.score>b.score?a:b);let dlr=.001*(Math.random()-.5);let dbs=Math.pow(2,Math.floor(Math.random()*3-1));let ddr=.1*(Math.random()-.5);let lr=best.lr+dlr;let bs=best.bs+dbs;let dr=best.dr+ddr;lr=Math.max(.0001,Math.min(.1,lr));bs=Math.max(16,Math.min(128,bs));dr=Math.max(0,Math.min(.6,dr));this.addTest(lr,bs,dr,'grad')},updateViz(){this.T.forEach(t=>{t.age+=.01;let pulse=Math.sin(Date.now()*.003+t.age)*1.5;t.m.scale.set(1+pulse*.1,1+pulse*.1,1+pulse*.1);t.m.rotation.x+=.01;t.m.rotation.y+=.01})},u(){document.getElementById('t').textContent=this.tc;document.getElementById('best').textContent=this.best.score.toFixed(1);document.getElementById('mth').textContent=this.method;document.getElementById('prm').textContent=`lr:${this.best.lr.toFixed(4)} bs:${this.best.bs} dr:${this.best.dr.toFixed(2)}`},L(){requestAnimationFrame(()=>this.L());this.updateViz();if(Math.random()<.03){switch(this.method){case'grid':this.grid();break;case'random':this.random();break;case'bayesian':this.bayes();break;case'gradient':this.gradient();break}}let t=Date.now()*.0002;this.c.position.x=Math.sin(t)*120;this.c.position.z=Math.cos(t)*120;this.c.lookAt(0,0,0);this.u();this.R.render(this.s,this.c)}};H.i()</script></body></html>
