<!DOCTYPE html><html><head><meta charset="UTF-8"><title>🔍 Error Scanner</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:monospace;background:#0a0a0a;color:#0f0;padding:20px}h1{text-align:center;color:#0ff;margin-bottom:20px}.scanner{max-width:1200px;margin:0 auto}.file{background:#1a1a1a;border:1px solid #0f0;border-radius:5px;margin:10px 0;padding:15px}.file-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.filename{color:#0ff;font-size:16px;font-weight:bold}.state{padding:3px 8px;border-radius:3px;font-size:11px}.state.idle{background:#444;color:#aaa}.state.scanning{background:#ff8800;color:#000}.state.valid{background:#0f0;color:#000}.state.error{background:#f00;color:#fff}.errors{margin-top:10px;padding:10px;background:#2a0a0a;border-left:3px solid #f00;display:none}.errors.show{display:block}.error-item{margin:5px 0;color:#ff6666}.warnings{margin-top:10px;padding:10px;background:#2a2a0a;border-left:3px solid #ff0;display:none}.warnings.show{display:block}.warning-item{margin:5px 0;color:#ffff66}.success{margin-top:10px;padding:10px;background:#0a2a0a;border-left:3px solid #0f0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0;padding:20px;background:#1a1a1a;border:1px solid #0ff;border-radius:5px}.stat{text-align:center}.stat-value{font-size:32px;font-weight:bold;color:#0ff}.stat-label{font-size:12px;color:#888;margin-top:5px}button{background:#0f0;color:#000;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;font-family:monospace;font-weight:bold;font-size:14px;margin:5px}button:hover{background:#0ff}.progress{width:100%;height:20px;background:#333;border-radius:10px;overflow:hidden;margin:20px 0}.progress-bar{height:100%;background:linear-gradient(90deg,#0f0,#0ff);width:0%;transition:width .3s}.log{background:#1a1a1a;border:1px solid #0f0;border-radius:5px;padding:15px;max-height:300px;overflow-y:auto;margin-top:20px}.log-entry{margin:3px 0;font-size:12px}.log-entry.info{color:#0ff}.log-entry.warn{color:#ff0}.log-entry.error{color:#f00}.log-entry.success{color:#0f0}</style></head><body><h1>🔍 STATE MACHINE ERROR SCANNER</h1><div class="scanner"><div class="stats"><div class="stat"><div class="stat-value"id="total">0</div><div class="stat-label">TOTAL FILES</div></div><div class="stat"><div class="stat-value"id="valid">0</div><div class="stat-label">VALID</div></div><div class="stat"><div class="stat-value"id="errors">0</div><div class="stat-label">ERRORS</div></div><div class="stat"><div class="stat-value"id="warnings">0</div><div class="stat-label">WARNINGS</div></div></div><div style="text-align:center"><button onclick="S.scanAll()">🚀 SCAN ALL FILES</button><button onclick="S.reset()">🔄 RESET</button></div><div class="progress"><div class="progress-bar"id="progress"></div></div><div id="files"></div><div class="log"id="log"></div></div><script>const S={files:['virtual-repository-3d.html','neural-network-3d.html','galaxy-explorer-3d.html','particle-swarm-3d.html','dna-helix-3d.html','fractal-tree.html','vortex.html','quantum-field.html','matrix-cube.html','voxel-world.html','procedural-city.html','ecosystem.html','neural-training.html','model-evolution.html','data-pipeline.html','hyperparameter-search.html','attention-mechanism.html','reinforcement-learning.html','gradient-descent.html','feature-extraction.html','clustering.html','gan-training.html','transfer-learning.html','ensemble-methods.html'],states:{},validCount:0,errorCount:0,warningCount:0,log(msg,type='info'){let e=document.createElement('div');e.className='log-entry '+type;e.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;document.getElementById('log').appendChild(e);document.getElementById('log').scrollTop=999999},scanAll(){this.reset();this.log('Starting scan of all files...','info');this.files.forEach((f,i)=>{setTimeout(()=>this.scanFile(f),i*200)})},scanFile(f){this.log(`Scanning ${f}...`,'info');this.setState(f,'scanning');fetch(f).then(r=>r.text()).then(code=>{let results=this.analyze(f,code);this.showResults(f,results);if(results.errors.length>0){this.setState(f,'error');this.errorCount++}else if(results.warnings.length>0){this.setState(f,'warning');this.warningCount++}else{this.setState(f,'valid');this.validCount++}this.updateStats();this.updateProgress()}).catch(e=>{this.log(`Failed to load ${f}: ${e.message}`,'error');this.setState(f,'error');this.errorCount++;this.showResults(f,{errors:[`Failed to load file: ${e.message}`],warnings:[]})})},analyze(f,code){let errors=[];let warnings=[];if(!code.includes('<!DOCTYPE html'))warnings.push('Missing DOCTYPE declaration');if(!code.includes('three.min.js'))errors.push('Missing Three.js dependency');let varNames=code.match(/const\s+([A-Z])\s*=/g);if(varNames&&varNames.length>1){let names=varNames.map(v=>v.match(/const\s+([A-Z])/)[1]);let unique=new Set(names);if(unique.size!==names.length)warnings.push('Duplicate global variable names detected')}if(code.includes('undefined'))warnings.push('Literal "undefined" found in code');let braceOpen=code.split('{').length;let braceClose=code.split('}').length;if(braceOpen!==braceClose)errors.push(`Brace mismatch: ${braceOpen} open, ${braceClose} close`);let parenOpen=code.split('(').length;let parenClose=code.split(')').length;if(parenOpen!==parenClose)errors.push(`Parenthesis mismatch: ${parenOpen} open, ${parenClose} close`);if(!code.includes('requestAnimationFrame'))warnings.push('No animation loop detected');if(!code.includes('new THREE.Scene'))errors.push('No THREE.Scene initialization found');if(!code.includes('new THREE.WebGLRenderer'))errors.push('No WebGLRenderer found');if(code.includes('console.log'))warnings.push('Contains console.log statements');if(code.includes('debugger'))warnings.push('Contains debugger statement');let funcMatches=code.match(/function\s+\w+/g);if(funcMatches&&funcMatches.length>20)warnings.push(`High function count: ${funcMatches.length}`);let sizeKB=(code.length/1024).toFixed(2);if(parseFloat(sizeKB)>10)warnings.push(`Large file size: ${sizeKB}KB`);if(!code.includes('addEventListener'))warnings.push('No event listeners found');let syntaxIssues=this.checkSyntax(code);errors.push(...syntaxIssues);return{errors,warnings,size:sizeKB}},checkSyntax(code){let issues=[];try{new Function(code)}catch(e){issues.push(`Syntax error: ${e.message}`)}return issues},setState(f,state){if(!this.states[f]){let div=document.createElement('div');div.className='file';div.id='file-'+f.replace(/\W/g,'_');div.innerHTML=`<div class="file-header"><span class="filename">${f}</span><span class="state ${state}"id="state-${f.replace(/\W/g,'_')}">${state.toUpperCase()}</span></div><div class="errors"id="errors-${f.replace(/\W/g,'_')}"></div><div class="warnings"id="warnings-${f.replace(/\W/g,'_')}"></div>`;document.getElementById('files').appendChild(div);this.states[f]=state}else{this.states[f]=state;let el=document.getElementById('state-'+f.replace(/\W/g,'_'));if(el){el.className='state '+state;el.textContent=state.toUpperCase()}}},showResults(f,results){let fid=f.replace(/\W/g,'_');if(results.errors.length>0){let errDiv=document.getElementById('errors-'+fid);errDiv.className='errors show';errDiv.innerHTML='<strong>❌ ERRORS:</strong>'+results.errors.map(e=>`<div class="error-item">• ${e}</div>`).join('');this.log(`${f}: ${results.errors.length} error(s)`,'error')}if(results.warnings.length>0){let warnDiv=document.getElementById('warnings-'+fid);warnDiv.className='warnings show';warnDiv.innerHTML='<strong>⚠️ WARNINGS:</strong>'+results.warnings.map(w=>`<div class="warning-item">• ${w}</div>`).join('');this.log(`${f}: ${results.warnings.length} warning(s)`,'warn')}if(results.errors.length===0&&results.warnings.length===0){let fileDiv=document.getElementById('file-'+fid);let success=document.createElement('div');success.className='success';success.innerHTML=`<strong>✅ VALID</strong> - File size: ${results.size}KB`;fileDiv.appendChild(success);this.log(`${f}: VALID (${results.size}KB)`,'success')}},updateStats(){document.getElementById('total').textContent=this.files.length;document.getElementById('valid').textContent=this.validCount;document.getElementById('errors').textContent=this.errorCount;document.getElementById('warnings').textContent=this.warningCount},updateProgress(){let scanned=this.validCount+this.errorCount;let pct=(scanned/this.files.length)*100;document.getElementById('progress').style.width=pct+'%';if(scanned===this.files.length){this.log('Scan complete!','success')}},reset(){this.states={};this.validCount=0;this.errorCount=0;this.warningCount=0;document.getElementById('files').innerHTML='';document.getElementById('log').innerHTML='';document.getElementById('progress').style.width='0%';this.updateStats();this.log('Scanner reset','info')}};window.addEventListener('load',()=>{S.log('Error Scanner initialized','success');S.log(`${S.files.length} files queued for scanning`,'info')});S.updateStats()</script></body></html>
