uildNetwork(){const layers=[{n:10,x:-60},{n:16,x:-20},{n:16,x:20},{n:4,x:60}];this.L=[];layers.forEach((l,li)=>{let layer=[];for(let i=0;i<l.n;i++){let y=(i-l.n/2)*8;let neu=this.createNeuron(l.x,y,0,li);layer.push(neu)}this.L.push(layer);if(li>0){this.connectLayers(this.L[li-1],layer)}})},createNeuron(x,y,z,l){let g=new THREE.SphereGeometry(2,8,8);let c=[0xff0000,0xff00ff,0x00ffff,0x00ff00][l]||0xffffff;let m=new THREE.MeshPhongMaterial({color:c,emissive:c,emissiveIntensity:.5});let n={m:new THREE.Mesh(g,m),x,y,z,a:Math.random(),w:[],g:0,layer:l,active:0};n.m.position.set(x,y,z);this.s.add(n.m);return n},connectLayers(l1,l2){l1.forEach(n1=>{l2.forEach(n2=>{let w=Math.random()*2-1;n2.w.push({n:n1,w:w});let pts=[n1.m.position,n2.m.position];let g=new THREE.BufferGeometry().setFromPoints(pts);let mat=new THREE.LineBasicMaterial({color:w>0?0x00ff00:0xff0000,transparent:1,opacity:Math.abs(w)*.3});let line=new THREE.Line(g,mat);this.s.add(line);this.W.push({l:line,n1,n2,w:w})})})}train(){this.ep++;let input=this.L[0];input.forEach(n=>n.a=Math.random());this.forward();let target=this.L[this.L.length-1].map(()=>Math.random());this.loss=this.calcLoss(target);this.acc=Math.max(0,100-this.loss*100);if(Math.random()<.3)this.backprop()},forward(){for(let li=1;li<this.L.length;li++){this.L[li].forEach(n=>{let sum=0;n.w.forEach(c=>sum+=c.n.a*c.w);n.a=1/(1+Math.exp(-sum));n.active=n.a>.5?1:0})}},backprop(){for(let li=this.L.length-1;li>0;li--){this.L[li].forEach(n=>{n.w.forEach(c=>{let delta=(n.a-.5)*c.n.a*this.lr;c.w-=delta;this.W.forEach(w=>{if(w.n1===c.n&&w.n2===n){w.w=c.w;w.l.material.color.setHex(c.w>0?0x00ff00:0xff0000);w.l.material.opacity=Math.abs(c.w)*.3}})})})}this.loss*=.95},calcLoss(target){let sum=0;this.L[this.L.length-1].forEach((n,i)=>{let diff=n.a-(target[i]||.5);sum+=diff*diff});return sum/target.length},addLayer(){if(this.L.length>=8)return;let x=this.L[this.L.length-1][0].x+40;let layer=[];for(let i=0;i<12;i++){let y=(i-6)*8;layer.push(this.createNeuron(x,y,0,t
