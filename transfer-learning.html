<!DOCTYPE html><html><head><meta charset="UTF-8"><title>🔄 Transfer Learning</title><style>*{margin:0;padding:0}body{overflow:hidden;background:#0a1400}#c{position:fixed;top:0;left:0}#h{position:fixed;top:10px;left:10px;color:#88ff00;font:12px monospace;background:rgba(0,0,0,.9);padding:10px;border:1px solid #88ff00}#b{position:fixed;bottom:10px;left:10px;display:flex;gap:5px}.btn{background:rgba(136,255,0,.2);border:1px solid #88ff00;color:#88ff00;padding:8px 12px;cursor:pointer;font:11px monospace}.btn:hover{background:rgba(136,255,0,.4)}</style></head><body><div id="c"></div><div id="h">🔄 TRANSFER LEARNING<br>Pretrain: <span id="pre">0</span>%<br>Finetune: <span id="fine">0</span>%<br>Frozen: <span id="frz">0</span><br>Trainable: <span id="trn">0</span></div><div id="b"><button class="btn"onclick="T.pretrain()">🏋️ Pretrain</button><button class="btn"onclick="T.freeze()">❄️ Freeze</button><button class="btn"onclick="T.finetune()">🎯 Finetune</button><button class="btn"onclick="T.unfreeze()">🔥 Unfreeze</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const T={s:null,c:null,R:null,base:[],head:[],pretrainAcc:0,finetuneAcc:0,repo:{pretrained:['resnet','vgg','bert','gpt'],datasets:['imagenet','coco','wiki','books']},i(){this.s=new THREE.Scene();this.s.background=new THREE.Color(0x0a1400);this.s.fog=new THREE.Fog(0x0a1400,100,500);this.c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,1e3);this.c.position.set(0,60,120);this.c.lookAt(0,0,0);this.R=new THREE.WebGLRenderer({antialias:1});this.R.setSize(innerWidth,innerHeight);document.getElementById('c').appendChild(this.R.domElement);this.s.add(new THREE.AmbientLight(0x404040));let l=new THREE.PointLight(0x88ff00,1,400);l.position.set(0,100,0);this.s.add(l);this.buildModel();this.L();addEventListener('resize',()=>{this.c.aspect=innerWidth/innerHeight;this.c.updateProjectionMatrix();this.R.setSize(innerWidth,innerHeight)})},buildModel(){let label=this.makeLabel('PRE-TRAINED BASE',0x0088ff);label.position.set(-30,40,0);this.s.add(label);for(let i=0;i<6;i++){let y=i*10-25;let g=new THREE.BoxGeometry(15,8,15);let m=new THREE.MeshPhongMaterial({color:0x0088ff,emissive:0x0088ff,emissiveIntensity:.5,transparent:1,opacity:.8});let layer={m:new THREE.Mesh(g,m),y:y,frozen:1,acc:Math.random()*.5+.4,type:'base'};layer.m.position.set(-30,y,0);this.s.add(layer.m);let eg=new THREE.EdgesGeometry(g);let em=new THREE.LineBasicMaterial({color:0x00ffff,linewidth:2});let edges=new THREE.LineSegments(eg,em);layer.m.add(edges);this.base.push(layer)}let hlabel=this.makeLabel('TASK HEAD',0xff8800);hlabel.position.set(30,40,0);this.s.add(hlabel);for(let i=0;i<3;i++){let y=i*10-35;let g=new THREE.BoxGeometry(12,8,12);let m=new THREE.MeshPhongMaterial({color:0xff8800,emissive:0xff8800,emissiveIntensity:.5,transparent:1,opacity:.8});let layer={m:new THREE.Mesh(g,m),y:y,frozen:0,acc:Math.random()*.3,type:'head'};layer.m.position.set(30,y,0);this.s.add(layer.m);let eg=new THREE.EdgesGeometry(g);let em=new THREE.LineBasicMaterial({color:0xffff00,linewidth:2});let edges=new THREE.LineSegments(eg,em);layer.m.add(edges);this.head.push(layer)}for(let i=0;i<5;i++){let from=this.base[i];let to=i<this.base.length-1?this.base[i+1]:this.head[0];this.createConnection(from,to)}for(let i=0;i<this.head.length-1;i++){this.createConnection(this.head[i],this.head[i+1])}},createConnection(from,to){let pts=[new THREE.Vector3(from.m.position.x,from.y+4,0),new THREE.Vector3(to.m.position.x,to.y-4,0)];let g=new THREE.BufferGeometry().setFromPoints(pts);let m=new THREE.LineBasicMaterial({color:0x00ff00,transparent:1,opacity:.5});let line=new THREE.Line(g,m);this.s.add(line)},makeLabel(t,c){let canvas=document.createElement('canvas');canvas.width=256;canvas.height=32;let ctx=canvas.getContext('2d');ctx.fillStyle='#'+c.toString(16).padStart(6,'0');ctx.font='bold 14px monospace';ctx.fillText(t,5,22);let tex=new THREE.CanvasTexture(canvas);let mat=new THREE.SpriteMaterial({map:tex,transparent:1});let sprite=new THREE.Sprite(mat);sprite.scale.set(30,5,1);return sprite},pretrain(){this.base.forEach(l=>{l.acc=Math.min(1,l.acc+.05);this.pretrainAcc=this.base.reduce((s,x)=>s+x.acc,0)/this.base.length})},freeze(){this.base.forEach(l=>l.frozen=1)},unfreeze(){this.base.forEach(l=>l.frozen=0)},finetune(){this.head.forEach(l=>{l.acc=Math.min(1,l.acc+.08)});this.base.forEach(l=>{if(!l.frozen){l.acc=Math.min(1,l.acc+.02)}});let allLayers=[...this.base,...this.head];this.finetuneAcc=allLayers.reduce((s,x)=>s+x.acc,0)/allLayers.length},updateViz(){this.base.forEach((l,i)=>{l.m.rotation.y+=.01;let scale=.9+l.acc*.3;l.m.scale.set(scale,1,scale);l.m.material.emissiveIntensity=.2+l.acc*.6;if(l.frozen){l.m.material.color.setHex(0x0088ff);l.m.material.opacity=.6}else{l.m.material.color.setHex(0x00ff00);l.m.material.opacity=.9}});this.head.forEach((l,i)=>{l.m.rotation.y-=.01;let scale=.9+l.acc*.3;l.m.scale.set(scale,1,scale);l.m.material.emissiveIntensity=.2+l.acc*.6})},u(){document.getElementById('pre').textContent=(this.pretrainAcc*100).toFixed(1);document.getElementById('fine').textContent=(this.finetuneAcc*100).toFixed(1);let frozen=this.base.filter(l=>l.frozen).length;let trainable=this.base.filter(l=>!l.frozen).length+this.head.length;document.getElementById('frz').textContent=frozen;document.getElementById('trn').textContent=trainable},L(){requestAnimationFrame(()=>this.L());this.updateViz();if(Math.random()<.05)this.pretrain();if(Math.random()<.05)this.finetune();let t=Date.now()*.0003;this.c.position.x=Math.sin(t)*120;this.c.position.z=Math.cos(t)*120;this.c.lookAt(0,0,0);this.u();this.R.render(this.s,this.c)}};T.i()</script></body></html>
